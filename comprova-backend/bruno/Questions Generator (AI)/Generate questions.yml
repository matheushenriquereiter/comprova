info:
  name: Generate questions
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/generate-questions"
  body:
    type: json
    data: |-
      {
        "description": "Questões variadas",
        "skills": [
          {
            "name": "Java",
            "weight": 80
          },
          {
            "name": "Programação Orientada a Objetos",
            "weight": 20
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
