info:
  name: Create job posting
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/company/job-postings"
  body:
    type: json
    data: |-
      {
        "title": "Desenvolvedor Web",
        "description": "Estamos procurando um desenvolvedor web full-stack, com experiência em Java e Spring Boot para um projeto promissor e inovador.",
        "workplaceType": "REMOTE",
        "employmentType": "FULL_TIME",
        "location": "São Paulo, SP (Remoto)",
        "expiresAt": "2026-12-01T10:15:30",
        "skills": [
          {
            "name": "Java",
            "weight": 20
          },
          {
            "name": "Spring Boot",
            "weight": 60
          },
          {
            "name": "React",
            "weight": 20
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
