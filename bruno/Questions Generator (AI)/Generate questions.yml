info:
  name: Generate questions
  type: http
  seq: 1

http:
  method: GET
  url: "{{url}}/generate-question"
  body:
    type: json
    data: |-
      {
        "prompt": "Gere 10 perguntas sobre programação Java. Alterne conceitos e o jeito de responder. Peça para o candidato escrever um trecho de código."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
