info:
  name: Generate questions
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/generate-question"
  body:
    type: json
    data: |-
      {
        "prompt": "Gere 5 perguntas sobre Programação Orientada a Objetos em Java."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
