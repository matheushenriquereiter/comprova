info:
  name: Generate questions
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/generate-question"
  body:
    type: json
    data: |-
      [
        {
          "name": "Java",
          "weight": 20
        },
        {
          "name": "Go",
          "weight": 80
        }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
