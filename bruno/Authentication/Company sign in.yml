info:
  name: Company sign in
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/auth/sign-in"
  body:
    type: json
    data: |-
      {
        "email": "mathenriquereiter@gmail.com",
        "password": "matheus123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        const token = data.token || data.accessToken || data.access_token;

        if (token) {
          // Salva o token em uma variável de ambiente chamada "bearer_token"
          bru.setEnvVar("bearer_token", token);
          console.log("Token capturado com sucesso!");
        } else {
          console.log("Token não encontrado na resposta da API.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
